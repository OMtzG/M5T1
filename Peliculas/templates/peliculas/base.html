{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Peliculas{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'peliculas/css/style.css' %}">
</head>
<body>
    <header>
        <nav>
            <a href="{% url 'Peliculas:home' %}">Peliculas</a>
            {% if user.is_authenticated %}
                <span>Hola, {{ user.username }}</span>
                <form class="nav-form" method="post" action="{% url 'Peliculas:logout' %}">
                    {% csrf_token %}
                    <button type="submit">Cerrar sesión</button>
                </form>
            {% else %}
                <a href="{% url 'Peliculas:login' %}">Iniciar sesión</a>
                <a href="{% url 'Peliculas:signup' %}">Registrarse</a>
            {% endif %}
        </nav>
    </header>

    <main>
        {% block content %}
        {% endblock %}
    </main>

    <footer>
        <p>&copy; Peliculas</p>
    </footer>
</body>
</html>
